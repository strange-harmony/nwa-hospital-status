<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NWA Hospital Status</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one dark board that fills the screen (4x2 landscape, 2x4 portrait), readable across a room. Dark only, by design. */
:root {
  --bg: #0d1218; --panel: #161d26; --ink: #e7ecf2; --muted: #95a1b2;
  --open: #5bcf8a; --divert: #d63a2f; --partial: #ffb757; --sched: #b5aaff; --stale: #e6cc5c; --warn-ink: #ffe98a;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
.tv { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 1.2vh; padding-block: 2vh; padding-left: max(2vw, 16px, env(safe-area-inset-left, 0px)); padding-right: max(2vw, 16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.tv-head { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; }
.tv-head h1 { font-family: var(--cond); font-weight: 700; font-size: clamp(18px, 3.4vh, 48px); margin: 0; letter-spacing: .02em; text-transform: uppercase; }
.tally { display: flex; gap: 1.2em; color: var(--muted); font-size: clamp(13px, 2.4vh, 32px); }
.tally b { color: var(--ink); font-weight: 600; }
.tally .d b { color: #ff8b80; }
.tv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 1.2vh 1vw; min-height: 0; }
.tile { background: var(--panel); border-radius: 1.2vh; padding: 1.5vh 1.2vw; display: grid; grid-template-rows: auto auto 1fr auto; min-width: 0; min-height: 0; overflow: hidden; border: 2px solid transparent; }
.t-name { font-family: var(--cond); font-weight: 600; font-size: clamp(14px, min(3vh, 2.2vw), 44px); line-height: 1.05; }
.t-name small { display: block; font-size: .5em; color: var(--muted); letter-spacing: .1em; margin-top: .3vh; }
.t-state { align-self: center; font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(16px, min(5vh, 3.6vw), 80px); line-height: 1; }
.t-info { font-family: var(--mono); font-size: clamp(11px, 1.9vh, 26px); color: var(--muted); display: grid; gap: .4vh; font-variant-numeric: tabular-nums; }
.tile.open .t-state { color: var(--open); }
.tile.divert { background: var(--divert); }
.tile.divert, .tile.divert .t-name small, .tile.divert .t-info { color: #fff; }
.tile.partial { border-color: var(--partial); }
.tile.partial .t-state { color: var(--partial); }
.tile.sched .t-state { color: var(--sched); }
.stale { color: var(--stale); }
/* A divert nobody has confirmed lately: faded status, dashed border, and an age banner you can read across the room. */
.tile.old { border: 2px dashed var(--stale); }
.tile.old .t-state { opacity: .55; }
.tile.divert.old { background: color-mix(in srgb, var(--divert) 45%, var(--panel)); }
.age { justify-self: start; align-self: end; background: var(--stale); color: #1a1600; font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: clamp(12px, min(2.4vh, 1.5vw), 32px); padding: .3em .6em; border-radius: .35em; margin-top: .6vh; }
.tv-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .4vh 2vw; font-size: clamp(11px, 1.7vh, 22px); color: var(--muted); }
.tv-foot .bad { color: var(--stale); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .tile { transition: background-color .3s, border-color .3s; } }
@media (orientation: portrait) {
  .tv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .t-state { font-size: clamp(16px, min(5vh, 7.5vw), 96px); }
  .t-name { font-size: clamp(14px, min(3vh, 4.6vw), 52px); }
  .t-info { font-size: clamp(10px, min(1.8vh, 3vw), 30px); }
  .age { font-size: clamp(11px, min(2vh, 3.2vw), 32px); }
}
/* Phones: let the page scroll and size each tile to its content instead of squeezing all 8 into one screen. */
@media (max-width: 700px) {
  body { overflow: auto; }
  .tv { height: auto; min-height: 100%; gap: 12px; padding-block: 16px; }
  .tv-head h1 { font-size: 20px; }
  .tally { font-size: 15px; }
  .tv-grid { grid-auto-rows: auto; gap: 8px; }
  .tile { padding: 12px; gap: 6px; border-radius: 10px; grid-template-rows: auto auto auto auto; }
  .t-name { font-size: 16px; }
  .t-state { font-size: clamp(18px, 6.2vw, 30px); align-self: start; }
  .t-info { font-size: 12px; gap: 2px; }
  .age { font-size: 12px; margin-top: 2px; }
  .tv-foot { font-size: 12px; }
}
</style>
</head>
<body>
<div class="tv">
  <div class="tv-head">
    <div><h1>NWA Hospital Status</h1><div class="tally" id="tally"></div></div>
  </div>
  <div class="tv-grid" id="grid"></div>
  <div class="tv-foot"><span id="upd">Loading…</span><span>Read from the hospital GroupMe group. Confirm with the hospital before relying on it.</span></div>
</div>
<script>
async function loadData() {
  const r = await fetch('/api/status', { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const REFRESH_MS = 30000;
// A diversion with no update for this long is flagged so nobody trusts an old report.
const STALE_MS = 6 * 3600e3;
const TZ = 'America/Chicago';
const hhmm = ms => new Date(ms).toLocaleTimeString('en-US', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).replace(':', '');
const day = ms => new Date(ms).toLocaleDateString('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
// "ED Delay" is its own status; everything else reads as "<service> Divert".
const statusName = a => a.id === 'delay' ? a.label : a.label + ' Divert';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Plain-language age for banners: "45 min", "7 hours", "5 days".
function age(from, to) {
  const m = Math.max(0, Math.round((to - from) / 60000));
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  if (h < 48) return h + (h === 1 ? ' hour' : ' hours');
  return Math.floor(h / 24) + ' days';
}
function dur(from, to) {
  const m = Math.max(0, Math.round((to - from) / 60000));
  if (m < 60) return m + 'm';
  if (m < 48 * 60) return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  return Math.floor(m / 1440) + 'd ' + Math.floor((m % 1440) / 60) + 'h';
}

// Boils the API's per-service state down to one summary per hospital.
function summarize(d) {
  const label = id => d.services.find(s => s.id === id).label;
  const byId = Object.fromEntries(d.messages.map(m => [m.id, m]));
  const byName = [...d.hospitals].sort((a, b) => a.name.localeCompare(b.name));
  return byName.map(h => {
    const s = d.state[h.id] || {};
    const active = Object.entries(s).filter(([, v]) => v.active && v.since <= d.now)
      .sort(([a], [b]) => (a === 'ed' ? -1 : b === 'ed' ? 1 : 0))
      .map(([k, v]) => ({ id: k, label: label(k), ...v, stale: d.now - v.lastConfirmed > STALE_MS }));
    const sched = Object.entries(s).filter(([, v]) => v.active && v.since > d.now).map(([k, v]) => ({ id: k, label: label(k), ...v }));
    const last = Object.values(s).map(v => byId[v.last]).filter(Boolean).sort((a, b) => b.sentAt - a.sentAt)[0];
    const kind = active.length ? (active.some(a => a.id === 'ed') ? 'divert' : 'partial') : sched.length ? 'sched' : 'open';
    return { ...h, kind, active, sched, last };
  });
}

function render(d) {
  const hs = summarize(d);
  const nD = hs.filter(h => h.kind === 'divert' || h.kind === 'partial').length;
  document.getElementById('tally').innerHTML = `<span class="d"><b>${nD}</b> on divert</span><span><b>${hs.length - nD}</b> open</span>`;
  document.getElementById('grid').innerHTML = hs.map(h => {
    let state = 'Open', info = '', banner = '';
    if (h.active.length) {
      state = h.active.map(a => esc(statusName(a))).join(' + ');
      const a = h.active[0];
      const old = h.active.every(x => x.stale);
      const newest = Math.max(...h.active.map(x => x.lastConfirmed));
      if (old) banner = `<div class="age">Last report ${age(newest, d.now)} ago</div>`;
      // The age banner already says how old it is, so skip the time lines on old reports.
      if (!old) info = `<span>${a.sinceUnknown ? 'Reported' : 'Since'} ${hhmm(a.since)}</span><span>Confirmed ${hhmm(newest)}</span>`;
    } else if (h.sched.length) {
      state = 'Divert ' + hhmm(h.sched[0].since);
      info = `<span>${esc(statusName(h.sched[0]))} scheduled</span>`;
    } else if (h.last) info = `<span>Last report ${age(h.last.sentAt, d.now)} ago</span>`;
    const isOld = !!banner;
    return `<div class="tile ${h.kind}${isOld ? ' old' : ''}"><div class="t-name">${esc(h.name)}${h.note ? `<small>${esc(h.note)}</small>` : ''}</div><div></div><div class="t-state">${state}</div>${banner || `<div class="t-info">${info}</div>`}</div>`;
  }).join('');
}

let lastOk = 0, failing = false;
function stamp() {
  const upd = document.getElementById('upd');
  if (!lastOk) { upd.textContent = failing ? 'Can’t reach the server. Retrying every 30 seconds.' : 'Loading…'; upd.className = failing ? 'bad' : ''; return; }
  const age = Date.now() - lastOk;
  upd.textContent = failing ? `Can’t reach the server. Showing status from ${dur(lastOk, Date.now())} ago.` : age < 60000 ? 'Updated just now' : `Updated ${dur(lastOk, Date.now())} ago`;
  upd.className = failing ? 'bad' : '';
}

async function refresh() {
  try {
    render(await loadData());
    lastOk = Date.now(); failing = false;
  } catch (e) {
    failing = true;
  }
  stamp();
}
refresh();
setInterval(refresh, REFRESH_MS);
setInterval(stamp, 10000);
</script>
</body>
</html>
